name: release
# Publishes to npm when a version tag is pushed, e.g. `npm version patch && git push --follow-tags`.
# Needs an npm automation token in the NPM_TOKEN repository secret.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Check the packed package runs
        run: |
          npm run build
          npm pack --silent
          mkdir -p "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try" && npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/app-xray-*.tgz
          npx app-xray scan "$GITHUB_WORKSPACE/test/fixtures/demo-app" --out out --quiet && test -s out/report.html
          rm "$GITHUB_WORKSPACE"/app-xray-*.tgz
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
