name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Scan the fixture app end to end
        run: node dist/cli.js scan test/fixtures/demo-app --out xray-out --quiet && test -s xray-out/report.html
      - name: Reject a missing path with a usage error
        run: node dist/cli.js scan does-not-exist --quiet && exit 1 || test $? -eq 2
      - name: Build a gallery from the fixture report
        run: |
          mkdir -p reports && cp -r xray-out reports/demo-app
          node dist/cli.js gallery reports --out site --quiet && test -s site/index.html && test -s site/apps/demo-app/index.html
